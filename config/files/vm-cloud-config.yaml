#cloud-config

write_files:
  #https://docs.docker.com/engine/security/userns-remap/
  #https://dreamlab.net/en/blog/post/user-namespace-remapping-an-advanced-feature-to-protect-your-docker-environments/
  - path: /etc/subuid
    content: |
      dockremap:${dockremapUIDRangeStart}:65536
  - path: /etc/subgid
    content: |
      dockremap:${dockremapGIDRangeStart}:65536

bootcmd:
  #https://cloud.google.com/container-optimized-os/docs/how-to/create-configure-instance

  #https://cloud.google.com/container-optimized-os/docs/how-to/create-configure-instance#changing_the_time_zone
  - sudo rm /etc/localtime; sudo ln -s /usr/share/zoneinfo/${GCPTimeZone} /etc/localtime

  #mount vault-data
  - fsck.ext4 -tvy /dev/disk/by-id/scsi-0Google_PersistentDisk_vault-data
  - mkdir -p /mnt/disks/vault-data
  - mount -o discard,defaults /dev/disk/by-id/scsi-0Google_PersistentDisk_vault-data /mnt/disks/vault-data

  #mount vault-logs
  - fsck.ext4 -tvy /dev/disk/by-id/scsi-0Google_PersistentDisk_vault-logs
  - mkdir -p /mnt/disks/vault-logs
  - mount -o discard,defaults /dev/disk/by-id/scsi-0Google_PersistentDisk_vault-logs /mnt/disks/vault-logs

  #create docker-compose alias (works only in shell, not in scripts)
  #https://cloud.google.com/community/tutorials/docker-compose-on-container-optimized-os
  - echo alias docker-compose="'"'docker run --rm
    --userns=host
    -v /var/run/docker.sock:/var/run/docker.sock
    -v "$PWD:$PWD"
    -w="$PWD"
    docker:cli -- compose'"'" >> /etc/profile.d/docker-compose.sh

  #add the needed interactive user to 'docker' group
  - usermod -aG docker ${InteractiveDockerUser}
  - sed -i '6 a \\t"userns-remap":"default",' /etc/docker/daemon.json

runcmd:
  - systemctl restart docker
